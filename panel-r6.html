<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FDK · Acceso</title><style>[hidden]{display:none!important}body{margin:0;background:#14283e;color:#14283e;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{background:white;padding:24px;border-radius:18px;width:min(340px,85vw)}img{width:80px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;font:inherit}input{border:1px solid #aaa}button{background:#14283e;color:white;border:0}button.alt{background:#e66a09}p{overflow-wrap:anywhere}body.admin{display:block;background:#eef2f6}body.admin main{box-sizing:border-box;width:100%;max-width:1100px;margin:auto;border-radius:0;min-height:100vh}body.admin main>img{width:52px}#nav{position:fixed;inset:0 auto 0 0;width:min(300px,85vw);background:#14283e;color:white;padding:16px;overflow:auto;z-index:5;box-shadow:0 0 0 100vmax #0006}#nav button{text-align:left;background:#203b55}#nav button:disabled{opacity:.55}#menu{width:auto}#counts{background:#14283e;color:white;padding:20px;border-radius:12px}#fleet article{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:10px}#fleet article button{width:auto;margin-right:8px}#team p{padding:10px;background:#eef2f6;border-radius:8px}</style><main><img src="icon-192.png" alt="FDK"><h1>FDK Manager</h1><p>Acceso de empresa · 0.3.0 · revisión 6</p><form id="login"><label>Correo<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Ingresar</button></form><button id="reset" class="alt">Crear o recuperar contraseña</button><form id="change" hidden><label>Nueva contraseña<input id="newpass" type="password" minlength="12" required autocomplete="new-password"></label><button>Guardar contraseña</button></form><button id="logout" hidden>Cerrar sesión</button><p id="status" role="status"></p><section id="dashboard" hidden><button id="menu">☰ Menú</button><nav id="nav" hidden><button id="closemenu">Cerrar menú ×</button><button data-page="home">Panel principal</button><button data-page="vehicles">Camiones</button><button data-page="staff">Equipo</button><button data-page="settings">Configuración</button><button disabled>Mapa GPS · Próximamente</button><button disabled>Clientes · Próximamente</button><button disabled>Agenda y servicios · Próximamente</button><button disabled>Jornadas · Próximamente</button><button disabled>Combustible · Próximamente</button><button disabled>TAG y peajes · Próximamente</button><button disabled>Finanzas · Próximamente</button><button disabled>Rentabilidad · Próximamente</button><button disabled>Facturación · Próximamente</button><button disabled>Cotizaciones · Próximamente</button><button disabled>Mantenciones · Próximamente</button><button disabled>Notificaciones · Próximamente</button><button disabled>Informes y fotografías · Próximamente</button><button disabled>Respaldos · Próximamente</button></nav><h2 id="pagetitle">Panel de flota</h2><div id="counts"></div><section id="vehiclesPage"><h3>Camiones</h3><div id="fleet"></div><form id="vehicle"><label>Nombre del camión<input id="truckname" required></label><label>Patente<input id="plate" required></label><label>Kilometraje<input id="odo" type="number" min="0" required></label><button>Agregar camión</button></form></section><section id="staffPage"><h3>Equipo</h3><div id="team"></div></section><section id="settingsPage" hidden><h3>Configuración</h3><p id="account"></p><p>Transferencia de propiedad y gestión de cuentas: pendientes.</p></section><button id="refresh">Actualizar panel</button></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://jwzgtzgmikkreecjuiey.supabase.co','sb_publishable_NS-C2C9bB934aGZICKWSog_woHtu-IM');
const el=id=>document.getElementById(id), msg=s=>el('status').textContent=s;
let recovery=false;
let currentPage='home';function page(p){currentPage=p;el('nav').hidden=true;el('pagetitle').textContent=({home:'Panel de flota',vehicles:'Camiones',staff:'Equipo',settings:'Configuración'})[p];el('counts').hidden=p!=='home';el('vehiclesPage').hidden=!['home','vehicles'].includes(p);el('staffPage').hidden=!['home','staff'].includes(p);el('settingsPage').hidden=p!=='settings';}el('menu').onclick=()=>el('nav').hidden=false;el('closemenu').onclick=()=>el('nav').hidden=true;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));
async function dashboard(){const results=await Promise.all([db.from('vehicles').select('id,name,license_plate,odometer_km,state,active'),db.from('staff').select('full_name,role,active'),db.from('work_shifts').select('id').eq('status','active')]);if(results.some(r=>r.error)){msg('No se pudo cargar el panel. Revisa permisos o conexión.');return;}const [v,s,w]=results.map(r=>r.data);el('counts').textContent=v.filter(x=>x.active).length+' camiones activos · '+s.filter(x=>x.active&&x.role==='driver').length+' conductores · '+w.length+' jornadas activas';function render(id,rows,format){el(id).replaceChildren();if(!rows.length)el(id).textContent='Sin registros';for(const x of rows){const p=document.createElement('p');p.textContent=format(x);el(id).append(p);}}el('fleet').replaceChildren();for(const x of v){const a=document.createElement('article'),p=document.createElement('p');p.textContent=x.name+' · '+(x.license_plate||'Sin patente')+' · '+x.odometer_km+' km · '+x.state;a.append(p);const edit=document.createElement('button');edit.textContent='Editar';edit.onclick=()=>{el('truckname').value=x.name;el('plate').value=x.license_plate||'';el('odo').value=x.odometer_km;el('vehicle').dataset.edit=x.id;el('vehicle').querySelector('button').textContent='Guardar cambios';};a.append(edit);const retire=document.createElement('button');retire.textContent=x.active?'Retirar':'Reactivar';retire.onclick=async()=>{if(!confirm('¿Confirmar cambio de estado?'))return;const {error}=await db.from('vehicles').update({active:!x.active,state:x.active?'retired':'available'}).eq('id',x.id);if(error)msg(error.message);else await dashboard();};a.append(retire);el('fleet').append(a);}if(!v.length)el('fleet').textContent='Sin camiones';render('team',s,x=>x.full_name+' · '+x.role+(x.active?'':' · Inactivo'));}
el('refresh').onclick=dashboard;el('vehicle').onsubmit=async e=>{e.preventDefault();const payload={name:el('truckname').value.trim(),license_plate:el('plate').value.trim().toUpperCase(),odometer_km:Number(el('odo').value)};const id=e.target.dataset.edit;const {error}=await (id?db.from('vehicles').update(payload).eq('id',id):db.from('vehicles').insert(payload));if(error){msg('No se pudo agregar el camión: '+error.message);return;}e.target.reset();delete e.target.dataset.edit;e.target.querySelector('button').textContent='Agregar camión';msg('Camión guardado.');await dashboard();};
const inviteLink=location.hash.includes('type=invite');
const redirectError=new URLSearchParams(location.hash.slice(1)).get('error');
if(redirectError)msg('El enlace no es válido o expiró. Solicita uno nuevo.');
async function profile(user,token){if(!user){msg('No se recibió el usuario autenticado.');return;}let data,e;try{const response=await fetch('https://jwzgtzgmikkreecjuiey.supabase.co/rest/v1/staff?select=full_name,role,active&auth_user_id=eq.'+encodeURIComponent(user.id),{headers:{apikey:'sb_publishable_NS-C2C9bB934aGZICKWSog_woHtu-IM',Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});const rows=await response.json();if(!response.ok)throw new Error(rows.message||'HTTP '+response.status);data=rows[0];}catch(err){e=err;}if(e||!data?.active){msg(e?'Error al consultar perfil: '+e.message:'Cuenta sin autorización activa.');return;}el('login').hidden=true;el('reset').hidden=true;el('logout').hidden=false;msg('Acceso verificado: '+data.full_name+' · '+data.role);if(['owner','manager'].includes(data.role)){document.body.classList.add('admin');el('account').textContent=user.email+' · '+data.role;el('dashboard').hidden=false;page('home');dashboard().catch(e=>msg('Error del panel: '+e.message));}else{el('dashboard').hidden=true;msg('Acceso conductor verificado. Panel de conductor pendiente.');}}
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||(session&&inviteLink)){recovery=true;el('change').hidden=false;el('login').hidden=true;el('reset').hidden=true;msg('Establece tu contraseña.');}else if(session&&!recovery&&event==='INITIAL_SESSION')setTimeout(()=>profile(session.user,session.access_token).catch(e=>msg('Error de sesión: '+e.message)),0);});
el('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;msg('Verificando credenciales…');try{const {data,error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error){msg('No se pudo ingresar: '+error.message);return;}if(!data.user){msg('No se recibió una sesión válida.');return;}el('password').value='';msg('Credenciales aceptadas. Cargando perfil…');await profile(data.user,data.session?.access_token);}catch(err){msg('Error de conexión o aplicación: '+err.message);}finally{b.disabled=false;}};
el('reset').onclick=async()=>{if(!el('email').reportValidity())return;const {error}=await db.auth.resetPasswordForEmail(el('email').value.trim(),{redirectTo:location.origin+'/FDK--Managers/auth.html'});msg(error?'No se pudo solicitar el correo. Intenta nuevamente.':'Si la cuenta existe, recibirás un correo de recuperación.');};
el('change').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:el('newpass').value});el('newpass').value='';if(error){msg('No se pudo guardar la contraseña. Solicita otro enlace.');return;}recovery=false;el('change').hidden=true;const {data:{session}}=await db.auth.getSession();await profile(session?.user,session?.access_token);};
el('logout').onclick=async()=>{await db.auth.signOut();location.replace(location.pathname);};
</script></html>
