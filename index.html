<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FDK Manager 0.1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#14283e;font:15px system-ui}header{background:#14283e;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:23px}header em{color:#f59e0b;font-style:normal}nav{display:flex;overflow:auto;background:white;position:sticky;top:0;z-index:2;padding:8px;gap:6px}button{border:0;border-radius:8px;padding:11px 15px;font:inherit;font-weight:600;cursor:pointer;background:#e2e8f0;color:#14283e;white-space:nowrap}button.active,button.primary{background:#14283e;color:white}button.add{background:#f59e0b}main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card,form,article{background:white;border:1px solid #dce3eb;border-radius:12px;padding:16px;margin-bottom:12px}.metric{font-size:24px;font-weight:750;margin-top:8px}small{color:#64748b}h2{margin:8px 0 16px}h3{margin:0 0 10px}label{display:block;font-weight:600;margin:10px 0}input,select{display:block;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;margin-top:5px;background:white} .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.danger{color:#b91c1c}.muted{color:#64748b}img{max-width:180px;max-height:140px}footer{text-align:center;padding:20px;color:#64748b}@media print{header,nav,footer,.actions,form,button{display:none!important}body{background:white}main{padding:0}}</style><header><b>▰ FDK <em>MANAGER</em></b><span>v0.1.0</span></header><nav id="nav"></nav><main id="main"></main><footer>FDK Manager · Datos locales de prueba</footer><script>
const defs={camiones:['Camiones',[['nombre','Identificación'],['patente','Patente'],['km','Kilometraje','number'],['estado','Estado',['Disponible','En ruta','Mantención']]]],conductores:['Conductores',[['nombre','Nombre'],['telefono','Teléfono'],['licencia','Vencimiento licencia','date']]],clientes:['Clientes',[['nombre','Nombre o razón social'],['rut','RUT'],['telefono','Teléfono'],['correo','Correo','email']]],servicios:['Servicios',[['cliente','Cliente','@clientes'],['camion','Camión','@camiones'],['conductor','Conductor','@conductores'],['fecha','Fecha','date'],['hora','Hora','time'],['origen','Origen'],['destino','Destino'],['carga','Carga'],['valor','Valor neto CLP','number'],['estado','Estado',['Programado','En ruta','Entregado','Cancelado']],['foto','Foto del servicio','file']]],gastos:['Gastos',[['camion','Camión','@camiones'],['fecha','Fecha','date'],['tipo','Categoría',['Combustible','TAG / peajes','Conductor','Mantención','Otros']],['monto','Monto neto CLP','number'],['detalle','Detalle']]],ingresos:['Otros ingresos',[['camion','Camión','@camiones'],['fecha','Fecha','date'],['monto','Monto neto CLP','number'],['detalle','Detalle']]],facturas:['Cobranzas',[['servicio','Orden de transporte','@servicios'],['numero','Número de factura'],['fecha','Fecha emisión','date'],['vence','Vencimiento','date'],['monto','Total factura CLP','number'],['estado','Estado',['Pendiente','Pagada']]]],mantenciones:['Mantenciones',[['camion','Camión','@camiones'],['detalle','Trabajo o documento'],['vence','Fecha de vencimiento','date'],['km','Kilometraje objetivo','number'],['estado','Estado',['Pendiente','Realizado']]]],cotizaciones:['Cotizaciones',[['cliente','Cliente','@clientes'],['fecha','Fecha','date'],['detalle','Descripción del traslado'],['monto','Valor neto CLP','number']]]};
const key='fdk-manager-v1';let db;try{db=JSON.parse(localStorage.getItem(key))}catch{}if(!db)db=Object.fromEntries(Object.keys(defs).map(k=>[k,[]]));let page='inicio',editing=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('es-CL',{style:'currency',currency:'CLP'}),today=()=>new Date().toLocaleDateString('sv-SE'),sum=(a,k)=>a.reduce((s,r)=>s+Number(r[k]||0),0),name=(k,id)=>{let r=db[k]?.find(x=>x.id===id);return r?(r.nombre||`${r.origen} → ${r.destino} (${r.fecha})`):'Sin asignar'};function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('No se pudo guardar. Espacio local insuficiente.');return false}}function go(p){page=p;editing=null;render()}function metrics(truck){let f=r=>(!truck||r.camion===truck)&&r.fecha?.startsWith(today().slice(0,7));let a=sum(db.servicios.filter(r=>f(r)&&r.estado==='Entregado'),'valor')+sum(db.ingresos.filter(f),'monto'),b=sum(db.gastos.filter(f),'monto');return [a,b,a-b]}function card(t,v){return `<div class="card"><small>${t}</small><div class="metric">${v}</div></div>`}function render(){let tabs={inicio:'Inicio',...Object.fromEntries(Object.entries(defs).map(([k,v])=>[k,v[0]])),agenda:'Agenda',respaldo:'Respaldo'};$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');let h='';if(page==='inicio'){let [a,b,c]=metrics();h=`<h2>Resumen del mes</h2><div class="grid">${card('Ingresos devengados',money(a))}${card('Gastos registrados',money(b))}${card('Resultado estimado',money(c))}${card('Camiones',db.camiones.length)}${card('Por cobrar',money(sum(db.facturas.filter(r=>r.estado==='Pendiente'),'monto')))}</div><h2>Rentabilidad por camión</h2>`+db.camiones.map(r=>{let [a,b,c]=metrics(r.id);return `<article><h3>${esc(r.nombre)}</h3>${esc(r.estado)} · ${esc(r.patente)}<p>Ingresos ${money(a)} · Gastos ${money(b)} · Resultado ${money(c)}</p></article>`}).join('')+`<h2>Alertas de vencimiento</h2>`+alerts()+`<button class="add" onclick="go('servicios')">+ Nuevo servicio</button>`}else if(page==='agenda'){h='<h2>Agenda de servicios</h2>'+db.servicios.filter(r=>r.estado!=='Cancelado').sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).map(r=>`<article><b>${esc(r.fecha)} ${esc(r.hora)}</b><p>${esc(r.origen)} → ${esc(r.destino)}</p>${esc(name('camiones',r.camion))} · ${esc(r.estado)}</article>`).join('')}else if(page==='respaldo'){h='<h2>Respaldo local</h2><article>Exporta tus datos antes de borrar el navegador o cambiar de dispositivo.<div class="actions"><button onclick="backup()">Exportar JSON</button></div><label>Restaurar respaldo (reemplaza datos actuales)<input type="file" accept=".json" onchange="restore(this)"></label></article>'}else{let [title,fields]=defs[page];let r=db[page].find(x=>x.id===editing)||{};h=`<h2>${title}</h2><form id="entry"><h3>${editing?'Editar':'Nuevo registro'}</h3>${fields.map(([k,l,t])=>field(k,l,t,r[k])).join('')}<div class="actions"><button class="add" type="submit">Guardar</button>${editing?'<button type="button" onclick="editing=null;render()">Cancelar</button>':''}</div></form>`+db[page].slice().reverse().map(r=>`<article>${fields.map(([k,l,t])=>t==='file'?(r[k]?`<img src="${esc(r[k])}" alt="Foto">`:''):`<div><small>${l}: </small>${esc(typeof t==='string'&&t.startsWith('@')?name(t.slice(1),r[k]):['monto','valor'].includes(k)?money(r[k]):r[k])}</div>`).join('')}<div class="actions"><button onclick="edit('${r.id}')">Editar</button><button class="danger" onclick="del('${r.id}')">Eliminar</button>${page==='cotizaciones'?`<button onclick="quote('${r.id}')">Imprimir / PDF</button>`:''}</div></article>`).join('')} $('main').innerHTML=h;let form=$('entry');if(form)form.onsubmit=submit;}
function field(k,l,t,v){let opts=Array.isArray(t)?t.map(x=>[x,x]):typeof t==='string'&&t.startsWith('@')?db[t.slice(1)].map(x=>[x.id,name(t.slice(1),x.id)]):null;return `<label>${l}${opts?`<select name="${k}"><option value="">Seleccionar</option>${opts.map(([id,n])=>`<option value="${esc(id)}" ${id===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`:`<input name="${k}" type="${t||'text'}" ${t==='file'?'accept="image/*"':`value="${esc(v??(t==='date'?today():''))}"`} ${['nombre','monto','valor','origen','destino'].includes(k)?'required':''} ${t==='number'?'min="0" step="1"':''}>`}</label>`}async function submit(e){e.preventDefault();let p=page,old=db[p].find(x=>x.id===editing),r={id:editing||crypto.randomUUID?.()||String(Date.now())};for(let [k,l,t] of defs[p][1]){let el=e.target.elements[k];if(t==='file'){r[k]=old?.[k]||'';if(el.files[0]){if(el.files[0].size>1500000){alert('Foto demasiado grande (máx. 1,5 MB).');return}r[k]=await new Promise(ok=>{let f=new FileReader();f.onload=()=>ok(f.result);f.readAsDataURL(el.files[0])})}}else r[k]=el.value}let prev=db[p];db[p]=[...prev.filter(x=>x.id!==r.id),r];if(!save()){db[p]=prev;return}editing=null;render()}function edit(id){editing=id;render();window.scrollTo(0,0)}function del(id){if(!confirm('¿Eliminar registro?'))return;let prev=db[page];db[page]=prev.filter(x=>x.id!==id);if(!save())db[page]=prev;render()}function alerts(){let limit=new Date();limit.setDate(limit.getDate()+30);let end=limit.toLocaleDateString('sv-SE');let a=[...db.mantenciones.filter(r=>r.estado==='Pendiente').map(r=>[r.detalle,r.vence]),...db.conductores.map(r=>['Licencia '+r.nombre,r.licencia]),...db.facturas.filter(r=>r.estado==='Pendiente').map(r=>['Factura '+r.numero,r.vence])].filter(r=>r[1]&&r[1]<=end);return a.length?a.map(r=>`<article>${esc(r[0])} · <b class="danger">${esc(r[1])}</b></article>`).join(''):'<p class="muted">Sin vencimientos registrados para los próximos 30 días.</p>'}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='FDK-respaldo-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Object.keys(defs).every(k=>Array.isArray(x[k])&&x[k].every(r=>r&&typeof r.id==='string'&&/^[a-zA-Z0-9-]+$/.test(r.id))))throw Error();if(confirm('¿Reemplazar todos los datos?')){let prev=db;db=x;if(!save())db=prev;render()}}catch{alert('Respaldo inválido')}}function quote(id){let r=db.cotizaciones.find(x=>x.id===id);$('main').innerHTML=`<article><h2>FDK Manager · Cotización</h2><p>Fecha: ${esc(r.fecha)}</p><p>Cliente: ${esc(name('clientes',r.cliente))}</p><p>${esc(r.detalle)}</p><h3>Neto: ${money(r.monto)}</h3><p>IVA no incluido. Documento no tributario.</p></article><div class="actions"><button onclick="window.print()">Guardar como PDF / imprimir</button><button onclick="render()">Volver</button></div>`}render();</script></html>
