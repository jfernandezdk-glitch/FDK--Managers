<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FDK · Acceso</title><style>[hidden]{display:none!important}body{margin:0;background:#14283e;color:#14283e;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{background:white;padding:24px;border-radius:18px;width:min(340px,85vw)}img{width:80px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;font:inherit}input{border:1px solid #aaa}button{background:#14283e;color:white;border:0}button.alt{background:#e66a09}p{overflow-wrap:anywhere}</style><main><img src="icon-192.png" alt="FDK"><h1>FDK Manager</h1><p>Acceso de empresa · 0.3.0 · revisión 4</p><form id="login"><label>Correo<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Ingresar</button></form><button id="reset" class="alt">Crear o recuperar contraseña</button><form id="change" hidden><label>Nueva contraseña<input id="newpass" type="password" minlength="12" required autocomplete="new-password"></label><button>Guardar contraseña</button></form><button id="logout" hidden>Cerrar sesión</button><p id="status" role="status"></p><section id="dashboard" hidden><h2>Panel de flota</h2><div id="counts"></div><h3>Camiones</h3><div id="fleet"></div><form id="vehicle"><label>Nombre del camión<input id="truckname" required></label><label>Patente<input id="plate" required></label><label>Kilometraje<input id="odo" type="number" min="0" required></label><button>Agregar camión</button></form><h3>Equipo</h3><div id="team"></div><button id="refresh">Actualizar panel</button></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://jwzgtzgmikkreecjuiey.supabase.co','sb_publishable_NS-C2C9bB934aGZICKWSog_woHtu-IM');
const el=id=>document.getElementById(id), msg=s=>el('status').textContent=s;
let recovery=false;
async function dashboard(){const results=await Promise.all([db.from('vehicles').select('id,name,license_plate,odometer_km,state,active'),db.from('staff').select('full_name,role,active'),db.from('work_shifts').select('id').eq('status','active')]);if(results.some(r=>r.error)){msg('No se pudo cargar el panel. Revisa permisos o conexión.');return;}const [v,s,w]=results.map(r=>r.data);el('counts').textContent=v.filter(x=>x.active).length+' camiones activos · '+s.filter(x=>x.active&&x.role==='driver').length+' conductores · '+w.length+' jornadas activas';function render(id,rows,format){el(id).replaceChildren();if(!rows.length)el(id).textContent='Sin registros';for(const x of rows){const p=document.createElement('p');p.textContent=format(x);el(id).append(p);}}render('fleet',v,x=>x.name+' · '+(x.license_plate||'Sin patente')+' · '+x.odometer_km+' km · '+x.state);render('team',s,x=>x.full_name+' · '+x.role+(x.active?'':' · Inactivo'));}
el('refresh').onclick=dashboard;el('vehicle').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('vehicles').insert({name:el('truckname').value.trim(),license_plate:el('plate').value.trim().toUpperCase(),odometer_km:Number(el('odo').value)});if(error){msg('No se pudo agregar el camión: '+error.message);return;}e.target.reset();msg('Camión registrado.');await dashboard();};
const inviteLink=location.hash.includes('type=invite');
const redirectError=new URLSearchParams(location.hash.slice(1)).get('error');
if(redirectError)msg('El enlace no es válido o expiró. Solicita uno nuevo.');
async function profile(user){if(!user){msg('No se recibió el usuario autenticado.');return;}const {data,error:e}=await db.from('staff').select('full_name,role,active').eq('auth_user_id',user.id).abortSignal(AbortSignal.timeout(15000)).maybeSingle();if(e||!data?.active){msg(e?'Error al consultar perfil: '+e.message:'Cuenta sin autorización activa.');await db.auth.signOut();return;}el('login').hidden=true;el('reset').hidden=true;el('logout').hidden=false;msg('Acceso verificado: '+data.full_name+' · '+data.role);if(['owner','manager'].includes(data.role)){el('dashboard').hidden=false;await dashboard();}else{el('dashboard').hidden=true;msg('Acceso conductor verificado. Panel de conductor pendiente.');}}
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||(session&&inviteLink)){recovery=true;el('change').hidden=false;el('login').hidden=true;el('reset').hidden=true;msg('Establece tu contraseña.');}else if(session&&!recovery&&event==='INITIAL_SESSION')setTimeout(()=>profile(session.user).catch(e=>msg('Error de sesión: '+e.message)),0);});
el('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;msg('Verificando credenciales…');try{const {data,error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error){msg('No se pudo ingresar: '+error.message);return;}if(!data.user){msg('No se recibió una sesión válida.');return;}el('password').value='';msg('Credenciales aceptadas. Cargando perfil…');await profile(data.user);}catch(err){msg('Error de conexión o aplicación: '+err.message);}finally{b.disabled=false;}};
el('reset').onclick=async()=>{if(!el('email').reportValidity())return;const {error}=await db.auth.resetPasswordForEmail(el('email').value.trim(),{redirectTo:location.origin+'/FDK--Managers/auth.html'});msg(error?'No se pudo solicitar el correo. Intenta nuevamente.':'Si la cuenta existe, recibirás un correo de recuperación.');};
el('change').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:el('newpass').value});el('newpass').value='';if(error){msg('No se pudo guardar la contraseña. Solicita otro enlace.');return;}recovery=false;el('change').hidden=true;const {data:{session}}=await db.auth.getSession();await profile(session?.user);};
el('logout').onclick=async()=>{await db.auth.signOut();location.replace(location.pathname);};
</script></html>
