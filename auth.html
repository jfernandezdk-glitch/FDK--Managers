<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FDK · Acceso</title><style>body{margin:0;background:#14283e;color:#14283e;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{background:white;padding:24px;border-radius:18px;width:min(340px,85vw)}img{width:80px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;font:inherit}input{border:1px solid #aaa}button{background:#14283e;color:white;border:0}button.alt{background:#e66a09}p{overflow-wrap:anywhere}</style><main><img src="icon-192.png" alt="FDK"><h1>FDK Manager</h1><p>Acceso de empresa · 0.3.0 desarrollo</p><form id="login"><label>Correo<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Ingresar</button></form><button id="reset" class="alt">Crear o recuperar contraseña</button><form id="change" hidden><label>Nueva contraseña<input id="newpass" type="password" minlength="12" required autocomplete="new-password"></label><button>Guardar contraseña</button></form><button id="logout" hidden>Cerrar sesión</button><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://jwzgtzgmikkreecjuiey.supabase.co','sb_publishable_NS-C2C9bB934aGZICKWSog_woHtu-IM');
const el=id=>document.getElementById(id), msg=s=>el('status').textContent=s;
let recovery=false;
async function profile(){const {data:{user},error}=await db.auth.getUser();if(error||!user)return;const {data,error:e}=await db.from('staff').select('full_name,role,active').eq('auth_user_id',user.id).maybeSingle();if(e||!data?.active){msg('Cuenta sin autorización activa.');await db.auth.signOut();return;}el('login').hidden=true;el('reset').hidden=true;el('logout').hidden=false;msg('Acceso verificado: '+data.full_name+' · '+data.role+' · Panel operativo pendiente de integración.');}
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||(session&&location.hash.includes('type=invite'))){recovery=true;el('change').hidden=false;el('login').hidden=true;el('reset').hidden=true;msg('Establece tu contraseña.');}else if(session&&!recovery)setTimeout(profile,0);});
el('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(error)msg('No se pudo ingresar. Revisa tus credenciales.');else await profile();};
el('reset').onclick=async()=>{if(!el('email').reportValidity())return;const {error}=await db.auth.resetPasswordForEmail(el('email').value.trim(),{redirectTo:location.origin+location.pathname});msg(error?'No se pudo solicitar el correo. Intenta nuevamente.':'Si la cuenta existe, recibirás un correo de recuperación.');};
el('change').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:el('newpass').value});el('newpass').value='';if(error){msg('No se pudo guardar la contraseña. Solicita otro enlace.');return;}recovery=false;el('change').hidden=true;await profile();};
el('logout').onclick=async()=>{await db.auth.signOut();location.replace(location.pathname);};
</script></html>
