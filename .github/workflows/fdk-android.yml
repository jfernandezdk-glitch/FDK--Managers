name: FDK Android test build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'panel-r31.html'
      - 'manifest-r31.webmanifest'
      - '.github/workflows/fdk-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - run: npm install
      - run: npm run prepareWeb
      - run: npx cap add android
      - run: node native/android/install.mjs
      - run: npx cap sync android
      - run: bash gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: FDK-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
