name: FDK Android test build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'panel-r31.html'
      - 'manifest-r31.webmanifest'
      - '.github/workflows/fdk-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - run: npm install
      - run: npm run prepareWeb
      - run: npx cap add android
      - run: node native/android/install.mjs
      - run: npx cap sync android
      - name: GPS integration contract checks
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const service=fs.readFileSync('native/android/FdkLocationService.java','utf8');
          const plugin=fs.readFileSync('native/android/FdkGpsPlugin.java','utf8');
          const panel=fs.readFileSync('../panel-r31.html','utf8');
          const installer=fs.readFileSync('native/android/install.mjs','utf8');
          for(const [name,source,pattern] of [
            ['network permission',installer,/ACCESS_NETWORK_STATE/],
            ['network recovery',service,/registerDefaultNetworkCallback/],
            ['durable queue',service,/getFD\(\).sync\(\)/],
            ['periodic retry',service,/15,java.util.concurrent.TimeUnit.SECONDS/],
            ['event identity',service,/payload.put\("p_event"/],
            ['rejected queue',service,/gps-rejected/],
            ['driver isolation',service,/st.equals\(j.optString\("staff_id"\)\)/],
            ['native refresh',service,/FdkGpsPlugin.refreshSession/],
            ['refresh serialization',plugin,/synchronized\(AUTH_LOCK\)/],
            ['UI refresh bridge',panel,/androidAuth.authRefresh/],
            ['GPS shutdown',service,/uploader.shutdownNow/]
          ]) {assert.match(source,pattern,name);console.log('PASS contract:',name);}
          JS
      - name: Run GPS JVM recovery simulations
        run: bash gradlew testDebugUnitTest --tests cl.transportefdk.manager.GpsRecoveryTest
        working-directory: mobile/android
      - run: bash gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: FDK-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
