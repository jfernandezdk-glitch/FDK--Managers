name: FDK Cartography
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 1,7 *'
  push:
    paths:
      - '.github/workflows/fdk-cartography.yml'
permissions:
  contents: read
concurrency:
  group: fdk-cartography
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Download Chile
        run: |
          curl --fail --location --retry 3 --max-time 1200 https://download.geofabrik.de/south-america/chile-latest.osm.pbf -o chile.osm.pbf
          mkdir -p catalog
          osmium fileinfo -e chile.osm.pbf > catalog/source-info.txt
          sha256sum chile.osm.pbf > catalog/source-sha256.txt
      - name: Extract tolls and road network
        run: |
          osmium tags-filter chile.osm.pbf n/barrier=toll_booth,toll_gantry n/highway=toll_gantry w/highway=motorway,motorway_link,trunk,trunk_link w/tunnel w/toll=yes -o filtered.osm.pbf
          osmium export filtered.osm.pbf -f geojsonseq --add-unique-id=type_id -o catalog/features.geojsonseq
          test -s catalog/features.geojsonseq
          python3 - <<'PY'
          import json, collections
          counts=collections.Counter()
          with open('catalog/features.geojsonseq') as f:
              for line in f:
                  obj=json.loads(line.lstrip('\x1e'))
                  p=obj.get('properties',{})
                  counts['features']+=1
                  if p.get('barrier') in ('toll_booth','toll_gantry') or p.get('highway')=='toll_gantry': counts['toll_candidates']+=1
                  if p.get('tunnel') not in (None,'no'): counts['tunnel_candidates']+=1
          assert counts['features']>0
          with open('catalog/summary.json','w') as f: json.dump(dict(counts),f,indent=2)
          print(dict(counts))
          PY
          printf '%s\n' 'OpenStreetMap contributors — ODbL https://www.openstreetmap.org/copyright' 'Source: https://download.geofabrik.de/south-america/chile.html' 'Candidate data only; not verified for billing. No database publication.' > catalog/README.txt
      - name: Cross-reference official MOP geography
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, math, collections
          base='https://rest-sit.mop.gob.cl/arcgis/rest/services/CCOP/'
          sources=['INFRA_DGC/MapServer/3','ELEMENTOS/MapServer/9','PuntosPeajes/MapServer/0']
          points=[]
          def query(layer,params):
              url=base+layer+'/query?'+urllib.parse.urlencode(dict(params,f='json'))
              with urllib.request.urlopen(url,timeout=90) as f: data=json.load(f)
              if 'error' in data: raise RuntimeError(str(data['error']))
              return data
          for layer in sources:
              ids=query(layer,{'where':'1=1','returnIdsOnly':'true'}).get('objectIds')
              if not ids: raise RuntimeError('Empty source: '+layer)
              rows=[]
              for i in range(0,len(ids),100):
                  data=query(layer,{'objectIds':','.join(map(str,ids[i:i+100])),'outFields':'*','outSR':4326,'returnGeometry':'true'})
                  if data.get('exceededTransferLimit'): raise RuntimeError('Truncated source')
                  rows.extend(data['features'])
              with open('catalog/mop-'+layer.split('/')[0]+'.json','w') as f: json.dump(rows,f,ensure_ascii=False)
              for row in rows:
                  g=row.get('geometry') or {}
                  if isinstance(g.get('x'),(int,float)) and isinstance(g.get('y'),(int,float)) and -76<g['x']<-65 and -57<g['y']<-17:
                      points.append((layer,g['x'],g['y'],row['attributes']))
          def distance(x,y,a,b):
              p,q=math.radians(y),math.radians(b)
              h=math.sin((q-p)/2)**2+math.cos(p)*math.cos(q)*math.sin(math.radians(a-x)/2)**2
              return 12742000*math.asin(min(1,math.sqrt(h)))
          counts=collections.Counter()
          with open('catalog/features.geojsonseq') as src,open('catalog/mop-matches.jsonl','w') as dst:
              for line in src:
                  obj=json.loads(line.lstrip(chr(30))); p=obj.get('properties',{}); g=obj.get('geometry') or {}
                  if not (p.get('barrier') in ('toll_booth','toll_gantry') or p.get('highway')=='toll_gantry') or g.get('type')!='Point': continue
                  x,y=g['coordinates'][:2]
                  matches=[]
                  for layer,a,b,attrs in points:
                      d=distance(x,y,a,b)
                      if d<=250: matches.append({'source':layer,'distance_m':round(d,2),'coordinates':[a,b],'attributes':attrs})
                  matches.sort(key=lambda m:m['distance_m'])
                  state='nearby_candidates' if matches else 'unmatched'
                  counts[state]+=1
                  if not p.get('name'): counts['unnamed_'+state]+=1
                  dst.write(json.dumps({'osm_id':obj.get('id'),'coordinates':[x,y],'osm':p,'match_status':state,'review_status':'pending','matches':matches},ensure_ascii=False)+'\n')
          with open('catalog/mop-match-summary.json','w') as f: json.dump(dict(counts),f,indent=2)
          print(dict(counts))
          PY
      - name: Audit candidate matches and publish summary
        run: |
          python3 - <<'PY'
          import json, collections, os, unicodedata, re
          def norm(v):
              return ' '.join(re.findall(r'[a-z0-9]+',unicodedata.normalize('NFKD',str(v)).encode('ascii','ignore').decode().lower()))
          counts=collections.Counter()
          fields=collections.Counter()
          with open('catalog/mop-matches.jsonl') as src, open('catalog/identity-review.jsonl','w') as dst:
              for line in src:
                  row=json.loads(line)
                  p=row['osm']; matches=row['matches']
                  keys=[norm(p.get(k,'')) for k in ('name','ref','operator','direction') ]
                  evidence=[]
                  for m in matches:
                      attrs=m['attributes']; fields.update(attrs.keys())
                      exact={k:[a for a,v in attrs.items() if keys[i] and norm(v)==keys[i]] for i,k in enumerate(('name','ref','operator','direction'))}
                      evidence.append(dict(m,exact_fields=exact))
                  strong=[m for m in evidence if m['distance_m']<=50 and (m['exact_fields']['name'] or m['exact_fields']['ref'])]
                  state='no_geographic_match' if not matches else 'identity_evidence' if strong else 'geographic_only'
                  counts[state]+=1
                  counts['total']+=1
                  if not p.get('name'): counts['unnamed_'+state]+=1
                  if len(matches)>1: counts['multiple_source_records']+=1
                  row.update(identity_status=state,review_status='pending',billing_eligible=False,matches=evidence)
                  dst.write(json.dumps(row,ensure_ascii=False)+'\n')
          with open('catalog/identity-summary.json','w') as f: json.dump(dict(counts),f,indent=2)
          with open('catalog/mop-field-inventory.json','w') as f: json.dump(dict(fields),f,indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## TAG identity audit\n\n| Metric | Count |\n|---|---:|\n')
              for k,v in sorted(counts.items()): f.write(f'| {k} | {v} |\n')
              f.write('\nAll records remain pending. Exact attribute matches are evidence only, not billing authorization. No database writes.\n')
          PY
      - name: Retrieve official documents
        run: |
          mkdir -p official
          curl -fLsS --retry 3 https://concesiones.mop.gob.cl/peajes-y-porticos/ -o official/index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          import urllib.request, pathlib, hashlib, json
          base='https://concesiones.mop.gob.cl/peajes-y-porticos/'
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=set()
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k=='href' and v:
                          u=urljoin(base,v)
                          p=urlparse(u)
                          if p.scheme=='https' and p.hostname=='concesiones.mop.gob.cl' and p.path.lower().endswith('.pdf') and '/2026/' in p.path:
                              self.urls.add(u)
          p=Links()
          p.feed(pathlib.Path('official/index.html').read_text())
          p.urls.update(['https://concesiones.mop.gob.cl/uploads/sites/4/2026/03/AUTOPISTA-CENTRAL.pdf','https://concesiones.mop.gob.cl/uploads/sites/4/2026/01/VESPUCIO-SUR.pdf','https://concesiones.mop.gob.cl/uploads/sites/4/2026/01/ACCESO-VIAL.pdf'])
          records=[]
          for i,u in enumerate(sorted(p.urls)):
              with urllib.request.urlopen(u,timeout=60) as r:
                  if urlparse(r.geturl()).hostname!='concesiones.mop.gob.cl': raise ValueError('Unexpected redirect')
                  data=r.read(25000001)
              if not data.startswith(b'%PDF-') or len(data)>25000000: raise ValueError(u)
              name=f'{i:03d}.pdf'
              pathlib.Path('official',name).write_bytes(data)
              records.append(dict(file=name,url=u,sha256=hashlib.sha256(data).hexdigest(),review_status='pending'))
          pathlib.Path('official/manifest.json').write_text(json.dumps(records,indent=2))
          print('PDFs:',len(records))
          PY
      - name: Rank identity and tariff document evidence
        run: |
          sudo apt-get install -y poppler-utils
          python3 - <<'PY'
          import json, pathlib, subprocess, re, unicodedata, difflib, collections, os
          def norm(v):
              s=unicodedata.normalize('NFKD',str(v)).encode('ascii','ignore').decode().lower()
              return ' '.join(re.findall('[a-z0-9]+',s))
          def names(a):
              return {norm(v) for k,v in a.items() if v and any(w in norm(k) for w in ('nombre','name','peaje','portico','codigo','conces','ruta','sentido','direccion')) and len(norm(v))>=4 and not norm(v).isdigit()}
          docs=[]
          for d in json.loads(pathlib.Path('official/manifest.json').read_text()):
              raw=subprocess.check_output(['pdftotext','-layout','official/'+d['file'],'-'],text=True)
              pathlib.Path('official',d['file']+'.txt').write_text(raw)
              docs.append((d,norm(raw)))
          counts=collections.Counter()
          with open('catalog/identity-review.jsonl') as src,open('catalog/tariff-evidence.jsonl','w') as dst:
              for line in src:
                  row=json.loads(line); p=row['osm']
                  osmnames={norm(p[k]) for k in ('name','ref','operator') if p.get(k) and len(norm(p[k]))>=4}
                  groups={}
                  for m in row['matches']:
                      ns=names(m['attributes'])
                      # Group only identical descriptive attributes and rounded coordinates; preserve every source record.
                      key=(tuple(sorted(ns)),tuple(round(x,5) for x in m['coordinates']))
                      groups.setdefault(key,[]).append(m)
                  candidates=[]
                  for (ns,xy),members in groups.items():
                      score=max((difflib.SequenceMatcher(None,a,b).ratio() for a in osmnames for b in ns),default=0)
                      hits=[]
                      for d,body in docs:
                          found=[n for n in ns if len(n)>=6 and ' '+n+' ' in ' '+body+' ']
                          if found: hits.append({'file':d['file'],'url':d['url'],'sha256':d['sha256'],'matched_terms':found})
                      candidates.append({'terms':ns,'coordinates':xy,'similarity':round(score,3),'distance_m':min(m['distance_m'] for m in members),'records':members,'document_hits':hits})
                  candidates.sort(key=lambda c:(-c['similarity'],c['distance_m']))
                  counts['total']+=1
                  counts['source_records']+=len(row['matches'])
                  counts['conservative_groups']+=len(groups)
                  if any(c['similarity']>=.85 for c in candidates): counts['similar_name_evidence']+=1
                  if any(c['document_hits'] for c in candidates): counts['tariff_document_evidence']+=1
                  if not candidates: counts['no_geographic_match']+=1
                  row.update(candidate_groups=candidates,billing_eligible=False,review_status='pending')
                  dst.write(json.dumps(row,ensure_ascii=False)+'\n')
          counts['documents_extracted']=len(docs)
          pathlib.Path('catalog/tariff-evidence-summary.json').write_text(json.dumps(dict(counts),indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## TAG tariff document evidence\n\n| Metric | Count |\n|---|---:|\n')
              for k,v in sorted(counts.items()): f.write(f'| {k} | {v} |\n')
              f.write('\nDocument text matches are leads only. No price extraction or billing authorization.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FDK-cartography-candidates
          path: |
            catalog/
            official/
          retention-days: 30
          if-no-files-found: error
