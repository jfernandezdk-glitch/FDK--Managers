name: FDK Cartography
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 1,7 *'
  push:
    paths:
      - '.github/workflows/fdk-cartography.yml'
permissions:
  contents: read
concurrency:
  group: fdk-cartography
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Download Chile
        run: |
          curl --fail --location --retry 3 --max-time 1200 https://download.geofabrik.de/south-america/chile-latest.osm.pbf -o chile.osm.pbf
          mkdir -p catalog
          osmium fileinfo -e chile.osm.pbf > catalog/source-info.txt
          sha256sum chile.osm.pbf > catalog/source-sha256.txt
      - name: Extract tolls and road network
        run: |
          osmium tags-filter chile.osm.pbf n/barrier=toll_booth,toll_gantry n/highway=toll_gantry w/highway=motorway,motorway_link,trunk,trunk_link w/tunnel w/toll=yes -o filtered.osm.pbf
          osmium export filtered.osm.pbf -f geojsonseq --add-unique-id=type_id -o catalog/features.geojsonseq
          test -s catalog/features.geojsonseq
          python3 - <<'PY'
          import json, collections
          counts=collections.Counter()
          with open('catalog/features.geojsonseq') as f:
              for line in f:
                  obj=json.loads(line.lstrip('\x1e'))
                  p=obj.get('properties',{})
                  counts['features']+=1
                  if p.get('barrier') in ('toll_booth','toll_gantry') or p.get('highway')=='toll_gantry': counts['toll_candidates']+=1
                  if p.get('tunnel') not in (None,'no'): counts['tunnel_candidates']+=1
          assert counts['features']>0
          with open('catalog/summary.json','w') as f: json.dump(dict(counts),f,indent=2)
          print(dict(counts))
          PY
          printf '%s\n' 'OpenStreetMap contributors — ODbL https://www.openstreetmap.org/copyright' 'Source: https://download.geofabrik.de/south-america/chile.html' 'Candidate data only; not verified for billing. No database publication.' > catalog/README.txt
      - name: Cross-reference official MOP geography
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, math, collections
          base='https://rest-sit.mop.gob.cl/arcgis/rest/services/CCOP/'
          sources=['INFRA_DGC/MapServer/3','ELEMENTOS/MapServer/9','PuntosPeajes/MapServer/0']
          points=[]
          def query(layer,params):
              url=base+layer+'/query?'+urllib.parse.urlencode(dict(params,f='json'))
              with urllib.request.urlopen(url,timeout=90) as f: data=json.load(f)
              if 'error' in data: raise RuntimeError(str(data['error']))
              return data
          for layer in sources:
              ids=query(layer,{'where':'1=1','returnIdsOnly':'true'}).get('objectIds')
              if not ids: raise RuntimeError('Empty source: '+layer)
              rows=[]
              for i in range(0,len(ids),100):
                  data=query(layer,{'objectIds':','.join(map(str,ids[i:i+100])),'outFields':'*','outSR':4326,'returnGeometry':'true'})
                  if data.get('exceededTransferLimit'): raise RuntimeError('Truncated source')
                  rows.extend(data['features'])
              with open('catalog/mop-'+layer.split('/')[0]+'.json','w') as f: json.dump(rows,f,ensure_ascii=False)
              for row in rows:
                  g=row.get('geometry') or {}
                  if isinstance(g.get('x'),(int,float)) and isinstance(g.get('y'),(int,float)) and -76<g['x']<-65 and -57<g['y']<-17:
                      points.append((layer,g['x'],g['y'],row['attributes']))
          def distance(x,y,a,b):
              p,q=math.radians(y),math.radians(b)
              h=math.sin((q-p)/2)**2+math.cos(p)*math.cos(q)*math.sin(math.radians(a-x)/2)**2
              return 12742000*math.asin(min(1,math.sqrt(h)))
          counts=collections.Counter()
          with open('catalog/features.geojsonseq') as src,open('catalog/mop-matches.jsonl','w') as dst:
              for line in src:
                  obj=json.loads(line.lstrip(chr(30))); p=obj.get('properties',{}); g=obj.get('geometry') or {}
                  if not (p.get('barrier') in ('toll_booth','toll_gantry') or p.get('highway')=='toll_gantry') or g.get('type')!='Point': continue
                  x,y=g['coordinates'][:2]
                  matches=[]
                  for layer,a,b,attrs in points:
                      d=distance(x,y,a,b)
                      if d<=250: matches.append({'source':layer,'distance_m':round(d,2),'coordinates':[a,b],'attributes':attrs})
                  matches.sort(key=lambda m:m['distance_m'])
                  state='nearby_candidates' if matches else 'unmatched'
                  counts[state]+=1
                  if not p.get('name'): counts['unnamed_'+state]+=1
                  dst.write(json.dumps({'osm_id':obj.get('id'),'coordinates':[x,y],'osm':p,'match_status':state,'review_status':'pending','matches':matches},ensure_ascii=False)+'\n')
          with open('catalog/mop-match-summary.json','w') as f: json.dump(dict(counts),f,indent=2)
          print(dict(counts))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FDK-cartography-candidates
          path: catalog/
          retention-days: 30
          if-no-files-found: error
